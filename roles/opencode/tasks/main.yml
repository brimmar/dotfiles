- name: Install opencode via official installer (no projetos clone required)
  become_user: "{{ host_user }}"
  block:
    - name: Ensure ~/.local/bin exists
      file:
        path: "{{ ansible_user_dir }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Download opencode install script
      get_url:
        url: https://opencode.ai/install
        dest: "/tmp/opencode-install.sh"
        mode: '0755'

    - name: Run opencode installer
      shell: "bash /tmp/opencode-install.sh"
      args:
        creates: "{{ ansible_user_dir }}/.local/bin/opencode"

    - name: Ensure ~/.local/share/opencode directory exists
      file:
        path: "/home/{{ host_user }}/.local/share/opencode"
        state: directory
        mode: '0700'

    - name: Deploy Opencode auth.json
      copy:
        content: "{{ vault_opencode_auth }}"
        dest: "/home/{{ host_user }}/.local/share/opencode/auth.json"
        mode: '0600'
      when: vault_opencode_auth is defined
