- name: Install PHP 8.5 only (ondrej)
  block:
    - name: Add ondrej/php PPA
      become: true
      apt_repository:
        repo: "ppa:ondrej/php"
        state: present

    - name: Install PHP 8.5 and common extensions
      become: true
      apt:
        name:
          - php8.5
          - php8.5-cli
          - php8.5-common
          - php8.5-curl
          - php8.5-gd
          - php8.5-mbstring
          - php8.5-xml
          - php8.5-zip
          - php8.5-bcmath
          - php8.5-intl
          - php8.5-readline
          - php8.5-sqlite3
          - php8.5-mysql
          - php8.5-pgsql
          - php8.5-redis
          - php8.5-imagick
          - php8.5-gmp
          - php8.5-soap
          - php8.5-opcache
        state: present
        update_cache: yes
