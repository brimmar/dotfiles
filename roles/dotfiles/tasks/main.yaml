- name: Setup Dotfiles
  block:
    - name: Log dotfiles setup start
      lineinfile:
        path: "{{ log_file }}"
        line: "{{ ansible_date_time.iso8601 }} - Starting dotfiles setup"
      ignore_errors: true

    - name: Git Clone Dotfiles
      become_user: "{{ host_user }}"
      block:
        - name: Ensure Dotfiles directory do not exists
          file:
            path: "/home/{{ host_user }}/dotfiles"
            state: absent

        - name: Git Clone
          command:
            chdir: "/home/{{ host_user }}"
            cmd: git clone -n --depth=1 --filter=tree:0 https://github.com/brimmar/dotfiles.git
          register: git_clone
          until: git_clone is success
          retries: 3
          delay: 5

        - name: Git Sparse Checkout
          shell:
            chdir: "/home/{{ host_user }}/dotfiles/"
            cmd: git sparse-checkout set --no-cone /dotfiles

        - name: Git Checkout
          shell:
            chdir: "/home/{{ host_user }}/dotfiles/"
            cmd: git checkout

    - name: Create Symlinks to config files
      become_user: "{{ host_user }}"
      block:
        - name: Symlink nvim
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/nvim/.config/nvim"
            dest: "/home/{{ host_user }}/.config/nvim"
            state: link
            force: yes
            mode: 0755

        - name: Symlink gitconfig
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/gitconfig/.gitconfig"
            dest: "/home/{{ host_user }}/.gitconfig"
            state: link
            force: yes
            mode: 0755

        - name: Symlink alacritty
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/alacritty/.config/alacritty"
            dest: "/home/{{ host_user }}/.config/alacritty"
            state: link
            force: yes
            mode: 0755

        - name: Symlink bashrc
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/oh-my-bash/.bashrc"
            dest: "/home/{{ host_user }}/.bashrc"
            state: link
            force: yes
            mode: 0755

        - name: Symlink Oh-My-Bash
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/oh-my-bash/.oh-my-bash/themes/sexy/sexy.theme.sh"
            dest: "/home/{{ host_user }}/.oh-my-bash/themes/sexy/sexy.theme.sh"
            state: link
            force: yes
            mode: 0755

        - name: Symlink Zellij
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/zellij/.config/zellij"
            dest: "/home/{{ host_user }}/.config/zellij"
            state: link
            force: yes
            mode: 0755

        - name: Ensure agent config parent directories exist
          file:
            path: "{{ item }}"
            state: directory
            mode: '0755'
          loop:
            - "/home/{{ host_user }}/.gemini"
            - "/home/{{ host_user }}/.gemini/antigravity-cli"
            - "/home/{{ host_user }}/.codex"
            - "/home/{{ host_user }}/.grok"
            - "/home/{{ host_user }}/.grokbot"
            - "/home/{{ host_user }}/.config/opencode"

        - name: Symlink Gemini config
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/gemini/config"
            dest: "/home/{{ host_user }}/.gemini/config"
            state: link
            force: yes

        - name: Symlink Gemini settings
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/gemini/settings.json"
            dest: "/home/{{ host_user }}/.gemini/settings.json"
            state: link
            force: yes

        - name: Symlink AGY settings
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/gemini/antigravity-cli/settings.json"
            dest: "/home/{{ host_user }}/.gemini/antigravity-cli/settings.json"
            state: link
            force: yes

        - name: Symlink AGY trusted hooks
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/gemini/antigravity-cli/trusted_hooks.json"
            dest: "/home/{{ host_user }}/.gemini/antigravity-cli/trusted_hooks.json"
            state: link
            force: yes

        - name: Symlink AGY skills
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/gemini/antigravity-cli/skills"
            dest: "/home/{{ host_user }}/.gemini/antigravity-cli/skills"
            state: link
            force: yes

        - name: Symlink AGY mcp
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/gemini/antigravity-cli/mcp"
            dest: "/home/{{ host_user }}/.gemini/antigravity-cli/mcp"
            state: link
            force: yes

        - name: Symlink Codex config
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/codex/config.toml"
            dest: "/home/{{ host_user }}/.codex/config.toml"
            state: link
            force: yes

        - name: Symlink Codex hooks
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/codex/hooks.json"
            dest: "/home/{{ host_user }}/.codex/hooks.json"
            state: link
            force: yes

        - name: Symlink Codex skills
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/codex/skills"
            dest: "/home/{{ host_user }}/.codex/skills"
            state: link
            force: yes

        - name: Symlink Codex prompts
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/codex/prompts"
            dest: "/home/{{ host_user }}/.codex/prompts"
            state: link
            force: yes

        - name: Symlink Grok config
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/grok/config.toml"
            dest: "/home/{{ host_user }}/.grok/config.toml"
            state: link
            force: yes

        - name: Symlink Grok hooks
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/grok/hooks"
            dest: "/home/{{ host_user }}/.grok/hooks"
            state: link
            force: yes

        - name: Symlink Grok skills
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/grok/skills"
            dest: "/home/{{ host_user }}/.grok/skills"
            state: link
            force: yes

        - name: Symlink Grokbot settings
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/grokbot/settings.json"
            dest: "/home/{{ host_user }}/.grokbot/settings.json"
            state: link
            force: yes

        - name: Symlink Opencode config
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/opencode/opencode.json"
            dest: "/home/{{ host_user }}/.config/opencode/opencode.json"
            state: link
            force: yes

        - name: Symlink Opencode commands
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/opencode/commands"
            dest: "/home/{{ host_user }}/.config/opencode/commands"
            state: link
            force: yes

        - name: Symlink Opencode plugins
          file:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/opencode/plugins"
            dest: "/home/{{ host_user }}/.config/opencode/plugins"
            state: link
            force: yes

    - name: Install Binary Scripts
      block:
        - name: Copy timer script to system bin
          copy:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/bin/timer"
            dest: "/usr/local/bin/timer"
            mode: 0755
          become: yes

        - name: Copy zellij-timer-status script to system bin
          copy:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/bin/zellij-timer-status"
            dest: "/usr/local/bin/zellij-timer-status"
            mode: 0755
          become: yes

        - name: Copy dotts-vault-decrypt script to system bin
          copy:
            src: "/home/{{ host_user }}/dotfiles/dotfiles/bin/dotts-vault-decrypt"
            dest: "/usr/local/bin/dotts-vault-decrypt"
            mode: 0755
          become: yes

    - name: Log dotfiles setup process
      lineinfile:
        path: "{{ log_file }}"
        line: "{{ ansible_date_time.iso8601 }} - Dotfiles setup completed successfully"
      ignore_errors: true

  rescue:
    - name: Log dotfiles setup failure
      lineinfile:
        path: "{{ log_file }}"
        line: "{{ ansible_date_time.iso8601 }} - Dotfiles setup failed"
      ignore_errors: true

    - name: Display error message
      debug:
        msg: "Dotfiles setup failed. Please check the logs for more details."

    - name: Attempt to remove incomplete dotfiles setup
      file:
        path: "/home/{{ host_user }}/dotfiles"
        state: absent
      ignore_errors: true

  always:
    - name: Ensure proper permissions for user home directory
      file:
        path: "/home/{{ host_user }}"
        owner: "{{ host_user }}"
        group: "{{ host_user }}"
        recurse: yes
      ignore_errors: true
