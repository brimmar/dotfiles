- name: Install brave
  block:
    - name: Install Brave
      when: ansible_distribution in ["Debian", "Ubuntu", "Pop!_OS"]
      block:
        - name: Add Brave Browser Repository
          block:
            - name: Download Brave GPG key
              get_url:
                url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
                dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
                mode: '0644'

            - name: Add Brave Repository
              apt_repository:
                repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
                state: present
                filename: brave-browser

        - name: Install Brave
          apt:
            name:
              - brave-browser

    - name: Restore Brave Profile and Keyrings
      become_user: "{{ host_user }}"
      block:
        - name: Check if Brave profile already exists
          stat:
            path: "/home/{{ host_user }}/.config/BraveSoftware/Brave-Browser/Default/Preferences"
          register: brave_profile_stat

        - name: Reassemble and restore Brave profile from split vault archive
          when: not brave_profile_stat.stat.exists
          block:
            - name: Decrypt and unarchive Brave profile and keyrings
              shell: |
                cat {{ playbook_dir }}/dotfiles/brave/brave-profile.tar.xz.part-* | python3 {{ playbook_dir }}/dotfiles/bin/dotts-vault-decrypt - | tar -xJ -C /home/{{ host_user }}/
              args:
                creates: "/home/{{ host_user }}/.config/BraveSoftware/Brave-Browser/Default/Preferences"
