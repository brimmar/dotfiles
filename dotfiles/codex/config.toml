[projects."/home/brimmar/projetos"]
trust_level = "trusted"

[projects."/home/brimmar"]
trust_level = "trusted"

[features]
unified_exec = true
shell_snapshot = true
steer = true
multi_agent = true
memories = true

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch", "used-tokens", "total-output-tokens", "total-input-tokens", "thread-credits", "estimated-thread-cost"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

[mcp_servers.brave]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--executablePath=/usr/bin/brave-browser", "--userDataDir=/home/brimmar/.cache/chrome-devtools-mcp/codex", "--no-usage-statistics", "--ignoreDefaultChromeArg=--enable-automation", "--ignoreDefaultChromeArg=--password-store=basic", "--chromeArg=--disable-blink-features=AutomationControlled", "--chromeArg=--no-default-browser-check", "--chromeArg=--enable-unsafe-webgpu", "--chromeArg=--enable-features=Vulkan"]
